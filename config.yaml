# ICU-PREDICT configuration
# ---------------------------------------------------------------
# Point `mimic_dir` at your local MIMIC-IV root (the folder that
# contains `hosp/` and `icu/`). Run with `--demo` to use the bundled
# synthetic stand-in data in the same layout instead.

paths:
  mimic_dir: data/raw/mimic-iv        # e.g. /data/physionet.org/files/mimiciv/3.1
  demo_dir: data/raw/demo-mimic-iv    # generated by `python run_pipeline.py --demo`
  processed_dir: data/processed
  outputs_dir: outputs

cohort:
  min_age: 18
  min_icu_hours: 12          # drop very short stays
  max_hours: 168             # only model the first 7 days of each stay
  first_stay_only: false     # true = one ICU stay per patient

demo:
  n_patients: 1500
  seed: 42

timeline:
  # forward-fill limits (hours) — beyond this a value counts as missing
  ffill_limit_vitals: 4
  ffill_limit_labs: 24

labels:
  horizon_hours: 6           # predict deterioration in (t, t+6]
  min_history_hours: 4       # need this many hours in the ICU before predicting
  sustained_hours: 2         # instability must last >= 2 consecutive hours
  censor_after_first_event: true
  min_observed_hours_for_negative: 3   # negatives need vitals in >=3 of the 6 future hours
  thresholds:
    sbp_low: 90
    map_low: 65
    hr_high: 130
    rr_high: 30
    spo2_low: 88
    lactate_high: 4.0

split:
  test_size: 0.15
  val_size: 0.15
  seed: 7

training:
  models: [logistic_regression, xgboost, lightgbm]
  selection_metric: auprc
  # How the alert threshold is picked on the validation set:
  #   budget      -> at most `alerts_per_patient_day` alerts per 24 patient-hours (limits alarm fatigue)
  #   sensitivity -> catch `alert_target_sensitivity` of positive hours, whatever the alarm burden
  alert_strategy: budget
  alerts_per_patient_day: 1.5
  watch_per_patient_day: 4.0       # "watch" (amber) band, budget strategy only
  alert_target_sensitivity: 0.80
  calibration: auto                # isotonic, sigmoid, or auto (sigmoid for small validation sets)
  # GRU sequence model, reported as a benchmark next to the tree models (needs `pip install torch`)
  gru:
    enabled: true
    window: 12          # hours of history it reads
    hidden: 64
    epochs: 30          # with early stopping on validation AUPRC
    cv_epochs: 12
  bootstrap_iterations: 200
  # Patient-grouped cross-validation. "auto" runs it when the cohort has fewer than
  # cv_auto_below_stays stays (e.g. the 100-patient MIMIC-IV demo), where a single
  # small test set gives noisy metrics. true = always, false = never.
  run_cv: auto
  cv_auto_below_stays: 500
  cv_folds: 5
  cv_repeats: 3

forecast:
  targets: [heart_rate, sbp, map, resp_rate, spo2, temp_c]
  horizons: [1, 2, 3, 4, 5, 6]     # forecast every hour of the next 6 hours
  n_estimators: 300
